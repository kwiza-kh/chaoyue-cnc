[package]
name = "chaoyue-cnc"
version = "1.2.0"
edition = "2021"

[dependencies]
tiny-skia = "0.11.4"
ttf-parser = "0.25.1"

[dependencies.windows-sys]
version = "0.52.0"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
